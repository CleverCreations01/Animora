workflows:
  android-release:
    name: Animora Android Release
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      java: 17

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true

    scripts:
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: Verify build tools
        script: |
          java -version
          "/Users/builder/programs/gradle-8.14.1/bin/gradle" --version

      - name: Build release APK
        script: |
          "/Users/builder/programs/gradle-8.14.1/bin/gradle" clean assembleRelease --no-daemon

    artifacts:
      - app/build/outputs/apk/release/app-release.apk
